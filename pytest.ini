[pytest]
pythonpath = .
testpaths = tests
asyncio_mode = auto
# Share one event loop across the run: agent.main builds its OpenAI client once at import,
# and its pooled connections break if each test gets a new loop.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
markers =
    integration: tests that call the real LLM and the real MCP server
